# Supabase Local Development Configuration
# For more options, see: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
# The other app in this project uses public. The pantry app uses pantry.
schemas = ["public", "pantry"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"

# Function names are shared by every app in the project, so each one has a pantry- prefix.
[functions.pantry-process-image]
verify_jwt = true

[functions.pantry-process-receipt]
verify_jwt = true

[functions.pantry-barcode-lookup]
verify_jwt = true

[functions.pantry-import-recipe]
verify_jwt = true

[functions.pantry-suggest-recipes]
verify_jwt = true
